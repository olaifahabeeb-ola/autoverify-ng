# Render service manifest for AutoVerify NG
# See https://render.com/docs/deploy-using-manifest for details
services:
  - type: web
    name: autoverify-ng
    env: docker
    branch: main
    plan: free
    repo: <replace-with-your-github-ssh-or-https-repo-url>
    buildCommand: ''
    startCommand: 'flask db upgrade && flask seed-demo && gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120'
    envVars:
      - key: SECRET_KEY
        value: "REPLACE_WITH_RANDOM_SECRET"
      - key: FLASK_DEBUG
        value: "0"
      - key: DATABASE_URL
        value: "REPLACE_WITH_DATABASE_URL_OR_LEAVE_EMPTY"
