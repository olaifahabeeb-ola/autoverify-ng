name: Tests

# Runs the full pytest suite on every push and pull request, so a broken
# build is caught automatically instead of being discovered during a demo.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Tesseract OCR (system binary)
        run: sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run test suite
        env:
          SECRET_KEY: ci-test-secret-key
          FLASK_DEBUG: "0"
        run: pytest tests/ -v --cov=. --cov-report=term-missing --cov-config=.coveragerc
