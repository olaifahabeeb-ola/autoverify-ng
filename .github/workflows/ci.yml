name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services: {}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            tesseract-ocr libtesseract-dev libgl1 libglib2.0-0 pkg-config

      - name: Create venv
        run: python -m venv .venv && . .venv/bin/activate && python -m pip install --upgrade pip

      - name: Install requirements
        run: . .venv/bin/activate && pip install -r requirements.txt

      - name: Run database migrations (noop if none)
        run: . .venv/bin/activate && flask db upgrade || true

      - name: Run tests
        run: . .venv/bin/activate && pytest -q
